# Tool configuration for the verification commands this repository is
# checked with. It carries no packaging metadata: nothing here builds a
# distribution, and the file exists so that `flake8`, `pytest` and
# `coverage` behave the same way from the repository root and from
# `backend/`, which are the two working directories the documented
# commands and the CI workflow use.
#
# flake8 and pytest both search upwards from the working directory for
# this file, so one copy at the repository root serves both invocation
# forms. The rationale for each setting below is recorded in
# docs/security/DECISION_LOG.md rather than here.

[flake8]
# The style the whole repository is held to is flake8's own default:
# 79-character lines, and a newline at the end of every file. No
# relaxation is applied project-wide.
#
# backend/app/api/router.py is the single exception. It is frozen: the
# subscription webhook mounts under the existing /subscriptions prefix
# precisely so that this module needs no edit, and it must stay
# byte-identical. Its two long lines and its missing final newline
# predate this work. The two codes they raise are ignored for that one
# module and for no other, so every other file -- and any other code
# raised by that module -- is still reported in full.
#
# flake8 resolves each pattern here against the directory it is invoked
# in, not against this file, so both documented invocation directories
# are listed: the repository root, where `flake8 backend` runs, and
# backend/, where the CI step's `flake8 .` runs. Whichever one is in
# use, the other resolves to a path no file has and matches nothing.
per-file-ignores =
    backend/app/api/router.py: E501,W292
    app/api/router.py: E501,W292

[tool:pytest]
# The asynchronous test contract is declared rather than inherited: in
# strict mode a coroutine test runs only when it carries
# @pytest.mark.asyncio, so an unmarked coroutine is reported instead of
# being silently skipped.
asyncio_mode = strict

# Coverage floor for the AAP's overall target. It is expressed here, and
# not in a [coverage:report] section, because coverage.py reads its
# configuration from the working directory only, while pytest searches
# upwards -- so this is the form that applies to a run started from
# backend/ as well as one started from the repository root. The option
# takes effect only when --cov is also supplied, so a run that measures
# no coverage is unaffected.
addopts = --cov-fail-under=80

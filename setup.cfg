# Tool configuration for the verification commands this repository is
# checked with. It carries no packaging metadata: nothing here builds a
# distribution. It configures `flake8`, `pytest` and `coverage` for both
# working directories the documented commands and the CI workflow use --
# the repository root and `backend/`.
#
# flake8 and pytest each search upwards from the working directory for
# this file, so one copy at the repository root serves both invocation
# forms. The rationale for every setting below is recorded in
# docs/security/DECISION_LOG.md; this file states only what each does.

[flake8]
# The style the whole repository is held to is flake8's own default:
# 79-character lines, and a newline at the end of every file. No
# relaxation is applied project-wide.
#
# backend/app/api/router.py is the single exception. That module is
# frozen and must stay byte-identical; its two long lines and its
# missing final newline predate this work. The two codes they raise are
# ignored for that one module and for no other, so every other file --
# and every other code raised by that module -- is still reported.
#
# flake8 resolves each pattern here against the directory it is invoked
# in, not against this file. Both documented invocation directories are
# therefore listed: the repository root, where `flake8 backend` runs, and
# backend/, where the CI step's `flake8 .` runs. Whichever is in use, the
# other resolves to a path no file has and matches nothing.
per-file-ignores =
    backend/app/api/router.py: E501,W292
    app/api/router.py: E501,W292

[tool:pytest]
# Strict asynchronous mode: a coroutine test runs only when it carries
# @pytest.mark.asyncio, and an unmarked coroutine is reported.
asyncio_mode = strict

# Marks declared here rather than left implicit, so a misspelled mark is
# reported instead of being applied to nothing.
markers =
    postgres: runs against the PostgreSQL server named by POSTGRES_TEST_URL. Skipped when none is named, and failed instead of skipped when REQUIRE_POSTGRES_TESTS is set.
    timing: measures elapsed wall-clock time, so an adverse pattern of host contention can move a reading. Every property one of these measures is also asserted deterministically by a case that is not marked, so `-m "not timing"` loses no coverage of the control itself.

# Coverage floor for the AAP's overall target. It is expressed here, and
# not in a [coverage:report] section, because coverage.py reads its
# configuration from the working directory only, while pytest searches
# upwards, so this form applies to a run started from backend/ as well as
# one started from the repository root. The option takes effect only when
# --cov is also supplied, so a run that measures no coverage is
# unaffected.
addopts = --cov-fail-under=80

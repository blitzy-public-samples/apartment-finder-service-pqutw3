version: '3.8'

services:
  frontend:
    build:
      context: ../../frontend
      # the image definition lives beside this file, not in the context
      dockerfile: ../infrastructure/docker/Dockerfile.frontend
      args:
        # SEC-12: build-time only. The :? form fails the build when the
        # value is unset or empty, so no wrong origin is baked into the
        # bundle and no empty argument passes for a supplied one
        - REACT_APP_API_BASE_URL=${REACT_APP_API_BASE_URL:?set the API origin the bundle calls}
        - REACT_APP_PAYPAL_CLIENT_ID=${REACT_APP_PAYPAL_CLIENT_ID:?set the public PayPal client identifier}
    ports:
      - "80:80"
    depends_on:
      - backend
    healthcheck:
      # the nginx image ships busybox wget, not curl
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  backend:
    build:
      context: ../../backend
      # the image definition lives beside this file, not in the context
      dockerfile: ../infrastructure/docker/Dockerfile.backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      # SEC-01/SEC-12: every setting Settings declares without a default,
      # each in the :? form so a missing value fails the container start
      # here rather than part-way through application import
      - DATABASE_URL=${DATABASE_URL:?set the application database URL}
      # SEC-01: backend reads SECRET_KEY
      - SECRET_KEY=${SECRET_KEY:?set the token signing key, 32 characters or more}
      - ALGORITHM=${ALGORITHM:?set the token signing algorithm}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:?set the token lifetime in minutes}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:?set the JSON array of allowed origins}
      - ZILLOW_API_URL=${ZILLOW_API_URL:?set the Zillow listings endpoint}
      - ZILLOW_API_KEY=${ZILLOW_API_KEY:?set the Zillow API key}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID:?set the PayPal client identifier}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET:?set the PayPal client secret}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:?set the SendGrid API key}
      - FROM_EMAIL=${FROM_EMAIL:?set the verified sender address}
      # SEC-10: db service is the Cloud SQL Auth Proxy on plain local TCP
      - DB_SSLMODE=disable
    healthcheck:
      # the slim Python image ships no curl; the schema document is served
      # without reaching the database
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  db:
    image: gcr.io/cloudsql-docker/gce-proxy:1.19.1
    command:
      - "/cloud_sql_proxy"
      - "-instances=<INSTANCE_CONNECTION_NAME>=tcp:5432"
    ports:
      - "5432:5432"
    volumes:
      - ./secrets:/secrets
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/google-credentials.json
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "5432"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

networks:
  default:
    driver: bridge

volumes:
  db-data:
    driver: local

# HUMAN ASSISTANCE NEEDED
# Please replace <INSTANCE_CONNECTION_NAME> with the actual Google Cloud SQL instance connection name.
# Also, ensure that the google-credentials.json file is placed in the ./secrets directory.
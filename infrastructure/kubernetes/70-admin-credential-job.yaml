# Operator provisioning of the seeded administrator's credential.
#
# 0002_seed_single_admin.py grants the administrative role to one address
# and stores a value no password produces, so the account holds the role
# and cannot authenticate. This job is the one supported path that gives it
# a credential, and it runs `python -m backend.app.core.admin_provisioning`
# from the same image the backend serves from.
#
# Apply it once per environment, after 60-migration-job.yaml has completed,
# and again only to perform a reset. It sits in the renderer's own
# admin-credential group, which neither deployment path applies. The
# sequence and the reset conditions are in
# docs/security/CREDENTIAL_ROTATION.md.
#
# The declarations below mount exactly the three values this run needs,
# under an identity whose only secret grants are those three. The backend
# identity holds no grant on ADMIN_SEED_PASSWORD, and no Kubernetes Secret
# object holds any of them.
#
# Every name below has a counterpart in infrastructure/terraform/main.tf:
# google_service_account.admin_provisioner supplies
# ${ADMIN_PROVISIONER_GCP_SERVICE_ACCOUNT_EMAIL},
# google_service_account_iam_member.admin_provisioner_workload_identity
# names ${K8S_NAMESPACE} and ${ADMIN_PROVISIONER_SERVICE_ACCOUNT}, and
# google_secret_manager_secret_iam_member.admin_provisioner grants the three
# secrets addressed here. Both halves must agree or the pod authenticates as
# nothing.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${ADMIN_PROVISIONER_SERVICE_ACCOUNT}
  namespace: ${K8S_NAMESPACE}
  labels:
    app.kubernetes.io/name: backend-admin-credential
    app.kubernetes.io/part-of: apartment-finder
  annotations:
    iam.gke.io/gcp-service-account: ${ADMIN_PROVISIONER_GCP_SERVICE_ACCOUNT_EMAIL}
automountServiceAccountToken: true
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: backend-admin-credential
  namespace: ${K8S_NAMESPACE}
  labels:
    app.kubernetes.io/name: backend-admin-credential
    app.kubernetes.io/part-of: apartment-finder
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/${GCP_PROJECT_ID}/secrets/SECRET_KEY/versions/latest"
        path: "SECRET_KEY"
      - resourceName: "projects/${GCP_PROJECT_ID}/secrets/DATABASE_URL/versions/latest"
        path: "DATABASE_URL"
      - resourceName: "projects/${GCP_PROJECT_ID}/secrets/ADMIN_SEED_PASSWORD/versions/latest"
        path: "ADMIN_SEED_PASSWORD"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: backend-admin-credential-${IMAGE_TAG}
  namespace: ${K8S_NAMESPACE}
  labels:
    app.kubernetes.io/name: backend-admin-credential
    app.kubernetes.io/part-of: apartment-finder
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-admin-credential
        app.kubernetes.io/part-of: apartment-finder
    spec:
      restartPolicy: Never
      serviceAccountName: ${ADMIN_PROVISIONER_SERVICE_ACCOUNT}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: admin-credential
          image: ${BACKEND_IMAGE}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              for name in SECRET_KEY DATABASE_URL ADMIN_SEED_PASSWORD; do
                file="/var/run/secrets/admin-credential/$name"
                if [ ! -s "$file" ]; then
                  echo "secret $name was not mounted at $file" >&2
                  exit 1
                fi
                export "$name=$(cat "$file")"
              done
              exec python -m backend.app.core.admin_provisioning
          envFrom:
            - configMapRef:
                name: backend-config
                optional: false
            - secretRef:
                name: backend-rate-limit-store
                optional: false
          env:
            - name: ENV_FILE
              value: ""
            - name: ADMIN_CREDENTIAL_RESET
              value: "${ADMIN_CREDENTIAL_RESET}"
          volumeMounts:
            - name: admin-credential
              mountPath: /var/run/secrets/admin-credential
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: admin-credential
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: backend-admin-credential
        - name: tmp
          emptyDir: {}

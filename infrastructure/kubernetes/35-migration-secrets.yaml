# Secret Manager to migration delivery.
#
# The migration resolves one setting, DATABASE_URL, and reads no other. It
# is therefore delivered by its own class rather than by the six-secret
# class in 30-backend-secrets.yaml, so the identity that runs it can hold
# read access to one secret instead of six. The grant is
# google_secret_manager_secret_iam_member.backend_migrate in
# infrastructure/terraform/main.tf, which names
# google_secret_manager_secret.database_url and no other secret.
#
# 60-migration-job.yaml is the one workload that mounts this class, and it
# runs under the migration service account 10-service-accounts.yaml
# declares rather than the backend's.
#
# The grant and this mount are two halves of one boundary: a grant of one
# secret with a class mounting six would fail at run time, and a class
# mounting one with a grant of six would leave the wider entitlement in
# place. Both name DATABASE_URL alone.
#
# No secretObjects is declared, so no synchronised Kubernetes Secret
# materialises and the value stays out of the cluster datastore. Only a
# version name appears below; no value does.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: backend-database
  namespace: ${K8S_NAMESPACE}
  labels:
    app.kubernetes.io/name: backend-migrate
    app.kubernetes.io/part-of: apartment-finder
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/${GCP_PROJECT_ID}/secrets/DATABASE_URL/versions/latest"
        path: "DATABASE_URL"

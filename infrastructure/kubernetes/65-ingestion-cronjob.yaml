# Periodic listing ingestion.
#
# The listing-refresh workload runs here. It executes
# backend.app.tasks.listing_updater.update_listings once per schedule on the
# backend image, so the ingestion code runs on the same CPython 3.9 base as
# the API and on a platform that supports it. Why it is a CronJob rather than
# a managed function is recorded in docs/security/DECISION_LOG.md and
# docs/review/CRITICAL_DECISIONS.md.
#
# The listing endpoint reaches this pod from the settings map and the
# provider key from Secret Manager through the CSI driver, mounted as files
# and exported by the shell before the task starts -- the same path
# 40-backend.yaml and 60-migration-job.yaml use, so no credential is written
# into a Kubernetes Secret. The class mounted below is backend-secrets,
# declared by 30-backend-secrets.yaml: the task imports the application's
# settings model, which refuses to construct unless every managed
# credential is present, so this pod reads all six and runs under the same
# service account the backend Deployment does. The key travels in a request
# header, never in a URL, and the logger redacts it from every record.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: listing-ingestion
  namespace: ${K8S_NAMESPACE}
  labels:
    app.kubernetes.io/name: listing-ingestion
    app.kubernetes.io/part-of: apartment-finder
spec:
  schedule: "${INGESTION_SCHEDULE}"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: listing-ingestion
            app.kubernetes.io/part-of: apartment-finder
        spec:
          restartPolicy: Never
          serviceAccountName: ${BACKEND_SERVICE_ACCOUNT}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: ingest
              image: ${BACKEND_IMAGE}
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  for name in SECRET_KEY DATABASE_URL ZILLOW_API_KEY \
                              PAYPAL_CLIENT_SECRET PAYPAL_WEBHOOK_ID \
                              SENDGRID_API_KEY; do
                    file="/var/run/secrets/backend/$name"
                    if [ ! -s "$file" ]; then
                      echo "secret $name was not mounted at $file" >&2
                      exit 1
                    fi
                    export "$name=$(cat "$file")"
                  done
                  exec python -c 'import asyncio; from backend.app.tasks.listing_updater import update_listings; asyncio.run(update_listings())'
              envFrom:
                - configMapRef:
                    name: backend-config
                    optional: false
                - secretRef:
                    name: backend-rate-limit-store
                    optional: false
              env:
                - name: ENV_FILE
                  value: ""
              volumeMounts:
                - name: backend-secrets
                  mountPath: /var/run/secrets/backend
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: backend-secrets
              csi:
                driver: secrets-store.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: backend-secrets
            - name: tmp
              emptyDir: {}

# Identities the workloads run as.
#
# The backend account carries the workload identity annotation, so a pod
# using it authenticates to Google as
# ${BACKEND_GCP_SERVICE_ACCOUNT_EMAIL}. That Google account holds no
# project-level role: its only grants are the six per-secret
# secretAccessor bindings declared in infrastructure/terraform/main.tf.
# The Google side of the binding is
# google_service_account_iam_member.backend_workload_identity, whose
# member names ${K8S_NAMESPACE} and ${BACKEND_SERVICE_ACCOUNT}. Both
# halves must agree or the pod authenticates as nothing.
#
# The migration account is separate from the backend account, so the
# identity that upgrades the schema holds read access to DATABASE_URL alone
# rather than to all six credentials. Its Google side is
# google_service_account.backend_migrate, and the binding permitting this
# Kubernetes account to assume it is
# google_service_account_iam_member.backend_migrate_identity, whose member
# names var.workload_identity_namespace and
# var.migration_kubernetes_service_account. The annotation below is
# assembled from the account ID and the project rather than passed in, so
# the deployment path needs no additional input.
#
# The frontend account carries no annotation. The frontend serves a built
# bundle and reads no Google API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${BACKEND_SERVICE_ACCOUNT}
  namespace: ${K8S_NAMESPACE}
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: apartment-finder
  annotations:
    iam.gke.io/gcp-service-account: ${BACKEND_GCP_SERVICE_ACCOUNT_EMAIL}
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${FRONTEND_SERVICE_ACCOUNT}
  namespace: ${K8S_NAMESPACE}
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: apartment-finder
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${MIGRATION_SERVICE_ACCOUNT}
  namespace: ${K8S_NAMESPACE}
  labels:
    app.kubernetes.io/name: backend-migrate
    app.kubernetes.io/part-of: apartment-finder
  annotations:
    iam.gke.io/gcp-service-account: ${MIGRATION_SERVICE_ACCOUNT_ID}@${GCP_PROJECT_ID}.iam.gserviceaccount.com
automountServiceAccountToken: true

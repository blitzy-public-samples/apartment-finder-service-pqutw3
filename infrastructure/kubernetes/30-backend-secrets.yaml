# Secret Manager to workload delivery.
#
# The six credentials the backend reads are never written into this
# repository and never appear in a manifest. The Secret Manager CSI
# driver, which google_container_cluster.primary enables through its
# secret_manager_config block, mounts each secret version into the pod
# filesystem at /var/run/secrets/backend/<name>. Each container that mounts
# this class reads those files and exports each one into its own environment
# before the application process replaces the shell.
#
# No Kubernetes Secret object is declared, so no credential is written to
# the cluster datastore and no credential is readable through the
# Kubernetes API.
#
# Authentication is the pod's own workload identity: the mount is
# performed as ${BACKEND_GCP_SERVICE_ACCOUNT_EMAIL}, whose only grants are
# the six per-secret roles/secretmanager.secretAccessor bindings declared
# in infrastructure/terraform/main.tf. No deployment credential takes part,
# and no principal outside those bindings can read a value.
#
# Each resourceName addresses the secret whose secret_id equals the
# setting name, which is the mapping locals.backend_secrets declares in
# infrastructure/terraform/main.tf. Version "latest" is addressed, so a
# rotation performed under docs/security/CREDENTIAL_ROTATION.md reaches a
# pod on its next start. Only version names appear below; no value does.
#
# This class carries all six credentials, so only the two workloads that
# read all six mount it: the backend Deployment in 40-backend.yaml and the
# listing-ingestion CronJob in 65-ingestion-cronjob.yaml. It declares no
# secretObjects, so no synchronised Kubernetes Secret materialises, the
# values stay out of the cluster datastore, and neither workload resolves a
# value through secretKeyRef.
#
# The two one-shot pods mount narrower classes of their own, under identities
# of their own, so neither holds six credentials for the length of its run:
# 35-migration-secrets.yaml declares backend-database, carrying DATABASE_URL
# alone, which 60-migration-job.yaml mounts; and 70-admin-credential-job.yaml
# declares backend-admin-credential, carrying DATABASE_URL and
# ADMIN_SEED_PASSWORD, which the Job in that same file mounts. Each class is
# paired with a grant naming the same secrets in
# infrastructure/terraform/main.tf, so no identity is entitled to a value its
# class does not mount.
#
# The provider is the GKE-managed one, which
# google_container_cluster.primary enables through secret_manager_config; the
# generic gcp provider would require the driver to be installed and its own
# identity to be bound separately.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: backend-secrets
  namespace: ${K8S_NAMESPACE}
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: apartment-finder
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/${GCP_PROJECT_ID}/secrets/SECRET_KEY/versions/latest"
        path: "SECRET_KEY"
      - resourceName: "projects/${GCP_PROJECT_ID}/secrets/DATABASE_URL/versions/latest"
        path: "DATABASE_URL"
      - resourceName: "projects/${GCP_PROJECT_ID}/secrets/ZILLOW_API_KEY/versions/latest"
        path: "ZILLOW_API_KEY"
      - resourceName: "projects/${GCP_PROJECT_ID}/secrets/PAYPAL_CLIENT_SECRET/versions/latest"
        path: "PAYPAL_CLIENT_SECRET"
      - resourceName: "projects/${GCP_PROJECT_ID}/secrets/PAYPAL_WEBHOOK_ID/versions/latest"
        path: "PAYPAL_WEBHOOK_ID"
      - resourceName: "projects/${GCP_PROJECT_ID}/secrets/SENDGRID_API_KEY/versions/latest"
        path: "SENDGRID_API_KEY"

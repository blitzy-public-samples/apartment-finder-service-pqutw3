[pytest]
# Base directory for the tmp_path and tmpdir fixtures. Pointing it inside
# the checkout keeps every temporary directory a test creates within a
# tree the run owns, instead of the shared /tmp/pytest-of-<user> root.
# .gitignore excludes this directory and both .dockerignore files keep it
# out of container images.
addopts = --basetemp=.pytest-basetemp

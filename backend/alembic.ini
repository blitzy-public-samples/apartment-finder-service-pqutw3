# Alembic configuration for the apartment-finder-service backend.
# Decision rationale is recorded in docs/security/DECISION_LOG.md.

[alembic]
# Path to the migration environment. %(here)s expands to the absolute
# directory containing this file.
script_location = %(here)s/migrations

# Paths prepended to sys.path before the migration environment is
# imported.
prepend_sys_path = %(here)s/..

# Character used to split the path lists above. "os" selects os.pathsep.
path_separator = os

# Naming template for generated revision files.
file_template = %%(rev)s_%%(slug)s

# Database URL. Supplied at runtime by migrations/env.py from the
# application settings.
sqlalchemy.url =


# Logging configuration, applied by migrations/env.py.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

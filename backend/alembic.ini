# Alembic configuration for the apartment-finder-service backend.

[alembic]
# Directory holding the migration environment. %(here)s expands to the
# absolute directory containing this file.
script_location = %(here)s/migrations

# Paths prepended to sys.path before the migration environment is
# imported. The value resolves to the repository root, under which the
# backend package lives.
prepend_sys_path = %(here)s/..

# Character the path lists above are split on. "os" selects os.pathsep.
path_separator = os

# Naming template for generated revision files. The revision identifiers
# "0001" and "0002" produce
# 0001_add_rbac_and_subscription_columns.py and
# 0002_seed_single_admin.py.
file_template = %%(rev)s_%%(slug)s

# Database URL. Left empty here; migrations/env.py supplies it at run
# time from the database-only migration configuration it builds. This
# file stores no credential.
sqlalchemy.url =

# This file declares no [loggers], [handlers] or [formatters] sections,
# so nothing here installs a handler and nothing here is applied through
# logging.config.fileConfig. migrations/env.py calls
# backend.app.core.logging.configure_migration_logging() instead, which
# installs the application's redacting JSON handler on the alembic and
# sqlalchemy namespaces, holds alembic at INFO so each revision's own
# record of what it changed is emitted, and disables propagation on both
# so no record reaches a handler installed elsewhere.

# Alembic configuration for the apartment-finder-service backend.
# Decision rationale is recorded in docs/security/DECISION_LOG.md.

[alembic]
# Path to the migration environment. %(here)s expands to the absolute
# directory containing this file, so the value resolves to the same
# location from any working directory.
script_location = %(here)s/migrations

# Paths prepended to sys.path before the migration environment is
# imported. This resolves to the repository root, under which the backend
# package lives, because modules are imported as backend.app.*.
prepend_sys_path = %(here)s/..

# Character used to split the path lists above. "os" selects os.pathsep,
# which keeps an absolute Windows path from being split on its
# drive-letter colon.
path_separator = os

# Naming template for generated revision files. With the revision
# identifiers "0001" and "0002" it produces
# 0001_add_rbac_and_subscription_columns.py and
# 0002_seed_single_admin.py.
file_template = %%(rev)s_%%(slug)s

# Database URL. Left empty here and supplied at run time by
# migrations/env.py from the validated application settings, so no
# credential is stored in this file.
sqlalchemy.url =


# Logging configuration, applied by migrations/env.py.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

# INFO makes each revision's own log output visible, including the
# administrative-grant revision's record of what it changed.
[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

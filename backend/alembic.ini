# Alembic configuration for the apartment-finder-service backend.
# Decision rationale is recorded in docs/security/DECISION_LOG.md.

[alembic]
# Directory holding the migration environment. %(here)s expands to the
# absolute directory containing this file.
script_location = %(here)s/migrations

# Paths prepended to sys.path before the migration environment is
# imported. The value resolves to the repository root, under which the
# backend package lives.
prepend_sys_path = %(here)s/..

# Character the path lists above are split on. "os" selects os.pathsep.
path_separator = os

# Naming template for generated revision files. The revision identifiers
# "0001" and "0002" produce
# 0001_add_rbac_and_subscription_columns.py and
# 0002_seed_single_admin.py.
file_template = %%(rev)s_%%(slug)s

# Database URL. Left empty here; migrations/env.py supplies it at run
# time from the validated application settings. This file stores no
# credential.
sqlalchemy.url =


# Logging configuration, applied by migrations/env.py.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

# INFO emits each revision's own log output, including the
# administrative-grant revision's record of what it changed.
[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

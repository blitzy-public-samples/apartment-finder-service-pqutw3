name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '14'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Audit Python dependencies
      run: |
        set -euo pipefail
        # CWE-1104: dependency advisory gate. Suppressed advisories, their
        # reachability assessments and the shared review trigger:
        # documentation/security/decision-log.md section 2.2
        # --all also audits pip, setuptools and wheel, which plain freeze omits
        pip freeze --all > /tmp/frozen.txt
        pip-audit --strict --no-deps -r /tmp/frozen.txt \
          --ignore-vuln PYSEC-2026-1325 --ignore-vuln PYSEC-2026-2132 \
          --ignore-vuln PYSEC-2026-161  --ignore-vuln PYSEC-2026-248 \
          --ignore-vuln PYSEC-2026-249  --ignore-vuln PYSEC-2026-2280 \
          --ignore-vuln PYSEC-2026-2281 --ignore-vuln PYSEC-2026-2275 \
          --ignore-vuln PYSEC-2026-141  --ignore-vuln PYSEC-2026-142

    # SEC-01, SEC-12: repository-wide credential scan over tracked content.
    # Pattern source of record; see documentation/security/decision-log.md
    - name: Scan for hardcoded credentials
      if: always()
      run: |
        if git grep -In -E "postgres:postgres|PASSWORD '[^']+'|SECRET_KEY=[A-Za-z0-9_]|password@" -- ':(exclude).github/workflows/ci.yml' ':(exclude)SECURITY.md'; then exit 1; fi

    # SEC-09: frontend client-secret guard
    - name: Scan frontend for client secrets
      if: always()
      run: |
        if grep -rIn -E "CLIENT_SECRET|client_secret" frontend/; then exit 1; fi

    # SEC-06: browser-storage guard
    - name: Scan frontend for browser token storage
      if: always()
      run: |
        if grep -rIn -E "localStorage|sessionStorage" frontend/src/; then exit 1; fi

    # SEC-02 to SEC-12: the security regression suite, reached even after a
    # step with a known non-zero baseline
    - name: Run backend security tests
      if: always()
      run: |
        cd backend
        python -m pytest tests/security -q

    - name: Install Node.js dependencies
      run: |
        cd frontend
        npm ci

    - name: Run ESLint
      run: |
        cd frontend
        npm run lint

    - name: Run Flake8
      run: |
        cd backend
        flake8 .

    - name: Run frontend unit tests
      run: |
        cd frontend
        npm test -- --coverage

    - name: Run backend unit tests
      run: |
        cd backend
        python -m pytest --cov=./ --cov-report=xml

    - name: Upload frontend test coverage
      uses: actions/upload-artifact@v2
      with:
        name: frontend-coverage
        path: frontend/coverage

    - name: Upload backend test coverage
      uses: actions/upload-artifact@v2
      with:
        name: backend-coverage
        path: backend/coverage.xml
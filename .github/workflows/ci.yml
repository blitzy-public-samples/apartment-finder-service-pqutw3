name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.9'

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '14'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install -r backend/requirements-dev.txt

    - name: Install Node.js dependencies
      run: |
        cd frontend
        npm ci

    - name: Run ESLint
      run: |
        cd frontend
        npm run lint

    - name: Run Flake8
      run: |
        cd backend
        flake8 .

    - name: Run pip-audit
      run: |
        # The advisory identifiers below are registered in
        # docs/security/RESIDUAL_RISK.md.
        pip-audit --strict -r backend/requirements.txt \
          --ignore-vuln PYSEC-2026-161 \
          --ignore-vuln PYSEC-2026-248 \
          --ignore-vuln PYSEC-2026-249 \
          --ignore-vuln PYSEC-2026-2280 \
          --ignore-vuln PYSEC-2026-2281 \
          --ignore-vuln PYSEC-2026-2270 \
          --ignore-vuln PYSEC-2026-2132
        pip-audit --strict -r backend/requirements-dev.txt \
          --ignore-vuln PYSEC-2026-1845 \
          --ignore-vuln PYSEC-2026-3625 \
          --ignore-vuln PYSEC-2026-1374 \
          --ignore-vuln PYSEC-2026-1375 \
          --ignore-vuln PYSEC-2026-2275 \
          --ignore-vuln PYSEC-2026-141 \
          --ignore-vuln PYSEC-2026-142

    - name: Run Bandit
      run: |
        bandit -r backend/app -ll

    - name: Check python-multipart is absent
      run: |
        ! pip show python-multipart

    - name: Check residual advisory reachability
      run: |
        ! grep -rEn "request\.form|request\.url|StaticFiles|HTTPEndpoint|Route\(|set_key|unset_key|\bclick\b" \
            --include=*.py backend/

    - name: Run frontend unit tests
      run: |
        cd frontend
        npm test -- --coverage

    - name: Run backend unit tests
      run: |
        python -m pytest backend/tests --cov=backend/app --cov-report=xml:backend/coverage.xml

    - name: Run backend security tests
      run: |
        python -m pytest backend/tests/security -q

    - name: Run integration tests
      run: |
        # HUMAN ASSISTANCE NEEDED
        # Add commands to run integration tests. This might involve setting up a test database,
        # starting both frontend and backend services, and running end-to-end tests.

    - name: Upload frontend test coverage
      uses: actions/upload-artifact@v7
      with:
        name: frontend-coverage
        path: frontend/coverage

    - name: Upload backend test coverage
      uses: actions/upload-artifact@v7
      with:
        name: backend-coverage
        path: backend/coverage.xml